<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; position: relative; font-family: "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif; background: #f4f6fb; color: #111827; }
  .copy { position: absolute; left: 72px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; gap: 28px; }
  .brand { font-size: 64px; font-weight: 800; letter-spacing: -2px; color: #111827; }
  .brand span { color: #1d4ed8; font-weight: 500; }
  .line { font-size: 30px; line-height: 1.5; font-weight: 600; color: #1f2937; word-break: keep-all; }
  .line b { color: #1d4ed8; font-weight: 700; }
  .rule { width: 56px; height: 5px; background: #1d4ed8; border-radius: 3px; }
  .shot { position: absolute; left: 590px; top: 96px; width: 760px; height: 600px; border-radius: 16px; background: #fff; border: 1px solid #d5dbe7; overflow: hidden; }
  .shot img { display: block; width: 760px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">UX Measure<span>Lab</span></div>
    <div class="rule"></div>
    <div class="line">질문에서 결정까지 —<br>계산은 코드가, <b>결정은 사람이</b></div>
  </div>
  <div class="shot"><img id="app" alt=""></div>
</body>
</html>
